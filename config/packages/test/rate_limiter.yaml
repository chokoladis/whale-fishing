framework:
    rate_limiter:
        register:
            policy: 'sliding_window'
            limit: 6
            interval: '10 minutes'
        password_restore:
            policy: 'sliding_window'
            limit: 6
            interval: '30 minutes'
        token_refresher:
            policy: 'sliding_window'
            limit: 4
            interval: '10 minutes'
        user_delete_restore:
            policy: 'sliding_window'
            limit: 3
            interval: '1 day'
        coin_get:
            policy: 'sliding_window'
            limit: 7
            interval: '1 minute'
        verify:
            policy: 'sliding_window'
            limit: 3
            interval: '1 minute'
        telegram_request:
            policy: 'sliding_window'
            limit: 3
            interval: '3 minute'
        api:
            policy: 'token_bucket'
            limit: 35
            rate: { interval: '1 minute' }

